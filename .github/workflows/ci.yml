name: Build and Push Docker Images
on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # צעד 1: משיכת הקוד מהריפוזיטורי אל ה-Runner הווירטואלי
      - name: Checkout code
        uses: actions/checkout@v3

      # צעד 2: התחברות ל-Registry של גיטהאב כדי שנוכל לדחוף לשם קונטיינרים
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # צעד 3: בניית ה-Image ודחיפתו לענן
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

  build-and-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

  deploy-to-openshift:
    needs: [build-and-push-backend, build-and-push-frontend] # ה-Job הזה ירוץ רק אחרי שהבנייה תסתיים בהצלחה
    runs-on: ubuntu-latest
    steps:
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: jakeos-dev

      - name: Update ImageStream and Rollout
        run: |
          # רענון הרישום כדי לוודא משיכה של ה-SHA העדכני מגיטהאב
          oc import-image backend-api:latest || true
          oc import-image frontend-ui:latest || true
          
          # הפעלה מחדש של הפודים עם האימג' החדש
          oc rollout restart deployment/backend-api
          oc rollout restart deployment/frontend-ui
          
          # המתנה לווידוא שהפודים עלו בהצלחה
          oc rollout status deployment/backend-api
          oc rollout status deployment/frontend-ui