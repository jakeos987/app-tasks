#version: '3.8'
services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_USER: ${JWT_USER:?Set JWT_USER in .env}
      JWT_PASSWORD: ${JWT_PASSWORD:?Set JWT_PASSWORD in .env}
      TASKS_PER_PAGE: ${TASKS_PER_PAGE:-5}
    ports:
      - "3000:3000"
    volumes:
    # מחבר תיקייה מקומית בשם 'backend-data' לנתיב שבו ה-SQLite נשמר
      - ./backend-data:/app/data
  
  
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api/todos
    ports:
      - "8080:8080"
    depends_on:
      - backend